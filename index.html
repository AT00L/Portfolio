<!doctype html>
<html lang="en" class="bg-page [&.is-loading]:overflow-hidden [&.menu-open]:overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      // Dark by default; light only if the visitor chose it. Runs before first paint, so no flash.
      ;(function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f4ef')
        }
      })()
    </script>
    <title>Atul Lilhare — Software Developer</title>
    <meta
      name="description"
      content="Atul Lilhare — software developer with 4+ years at CUBE. I build fast, reliable web apps in React and mobile apps in React Native."
    />
    <meta property="og:title" content="Atul Lilhare — Software Developer" />
    <meta
      property="og:description"
      content="Software developer with 4+ years at CUBE. I build things that ship."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="overflow-x-clip bg-page text-[17px] leading-[1.55] text-fg antialiased [text-rendering:optimizeLegibility] selection:bg-accent selection:text-ink"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
