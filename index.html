<!doctype html>
<html lang="en" data-theme="dark" class="bg-page [&.is-loading]:overflow-hidden [&.menu-open]:overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <script>
      // Dark by default; light only if the visitor chose it. Runs before first paint, so no flash.
      ;(function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#dff0fd')
        }

        // The built page arrives prerendered, intro screen included. Hide that copy of the
        // intro when the app is going to skip it (seen this session, or reduced motion).
        var skipIntro = matchMedia('(prefers-reduced-motion: reduce)').matches
        try {
          skipIntro = skipIntro || sessionStorage.getItem('intro-seen') === '1'
        } catch (e) {}
        if (skipIntro) document.documentElement.classList.add('no-intro')
      })()
    </script>
    <noscript>
      <style>
        /* Without JavaScript, show the prerendered page as is: no intro, nothing waiting to animate in. */
        [data-preloader] { display: none; }
        #root [style] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>

    <title>Atul Lilhare (AtulCode) — MERN & React Native Developer</title>
    <meta
